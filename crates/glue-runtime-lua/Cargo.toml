[package]
name = "glue-runtime-lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
glue-format.workspace = true
glue-resources.workspace = true
mlua.workspace = true
libc.workspace = true
thiserror.workspace = true

# Match mlua-sys's vendored source crate exactly rather than a moving range.
[build-dependencies]
lua-src.workspace = true
cc = "=1.6.0"

# Unsafe code is restricted to the platform prerequisite query module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
