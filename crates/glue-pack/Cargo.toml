[package]
name = "glue-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
python = ["dep:glue-runtime-python", "dep:glue-pbs", "dep:flate2", "dep:ruzstd", "dep:zip"]

[dependencies]
glue-runtime-node = { path = "../glue-runtime-node" }
glue-format.workspace = true
glue-runtime-python = { workspace = true, optional = true }
glue-pbs = { path = "../glue-pbs", optional = true }
flate2 = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
libc.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
