name: Native MVP acceptance

on:
  push:
    branches: ['codex/mvp-r04-docs']
  workflow_dispatch:
    inputs:
      target:
        description: Native GNU Linux acceptance cell
        type: choice
        options: [x86_64, aarch64, both]
        default: x86_64
        required: true
      compatibility:
        description: Also run seven traced Python archive/uv compatibility cases
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: mvp-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: GNU Linux ${{ matrix.architecture }} / native compact acceptance
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.target == 'both' && '[{"architecture":"x86_64","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"architecture":"aarch64","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}]' ||
            inputs.target == 'aarch64' && '[{"architecture":"aarch64","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}]' ||
            '[{"architecture":"x86_64","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]'
          ) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GLUE_MVP_CI_ROOT: /tmp/glue-mvp-native-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
      GLUE_MVP_CI_EXPECT_TARGET: ${{ matrix.target }}
      GLUE_MVP_COMPATIBILITY: ${{ inputs.compatibility && 'required' || 'disabled' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install explicit build and trace prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential ca-certificates curl patchelf python3 strace xz-utils libx11-6 libxext6 libxrender1 libxft2 libxss1 libfontconfig1 libfreetype6
          rustup toolchain install 1.88.0 --profile minimal
      - name: Build tools, run offline cases, and enforce reviewed cost budgets
        run: bash scripts/ci-mvp-linux.sh
      - name: Retain receipts, inventories, logs and complete traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mvp-native-linux-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GLUE_MVP_CI_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
